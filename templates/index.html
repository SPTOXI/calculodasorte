{% extends 'dashboard_base.html' %}

{% block title %}Painel de Loterias — Cálculo da Sorte | Inteligência Artificial & Estatística{% endblock %}

{% block extra_css %}
<style>

        :root {
            --bg-dark: #0b1120;
            --card-dark: #1e293b;
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #059669;
            --primary-light: #10b981;
            --gold: #f59e0b;
            --gold-dark: #d97706;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px 16px;
            background: radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.12) 0%, #0b1120 70%);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ============================================================
           1. BARRA SUPERIOR DO USUÁRIO (TOP BAR)
           ============================================================ */
        .user-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 12px 20px;
            margin-bottom: 25px;
            backdrop-filter: blur(12px);
            gap: 12px;
            flex-wrap: wrap;
        }

        .user-info-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .user-brand-logo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: white;
            font-weight: 800;
            font-size: 1.05rem;
            margin-right: 6px;
        }

        .user-brand-logo span.highlight {
            color: #34d399;
        }

        .user-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            letter-spacing: 0.3px;
        }

        .user-badge.vip {
            background: rgba(245, 158, 11, 0.2);
            color: var(--gold);
            border: 1px solid rgba(245, 158, 11, 0.4);
        }

        .user-badge.credits {
            background: rgba(16, 185, 129, 0.2);
            color: var(--primary-light);
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .user-badge.no-credits {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .user-top-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-top {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 0.88rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            white-space: nowrap;
        }

        .btn-top-avulso {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: #ffffff;
            border: 1px solid rgba(52, 211, 153, 0.4);
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
        }

        .btn-top-avulso:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(5, 150, 105, 0.45);
        }

        .btn-top-vip {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #0f172a;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35);
        }

        .btn-top-vip:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(245, 158, 11, 0.5);
        }

        .btn-top-ghost {
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-top-ghost:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        .btn-top-exit {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-top-exit:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        /* ============================================================
           2. HERO PERSUASIVO DE ALTA CONVERSÃO (SEDUZIR O LEAD)
           ============================================================ */
        .hero-banner {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.95) 0%, rgba(15, 23, 42, 0.95) 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 34px 30px;
            margin-bottom: 35px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .hero-banner::after {
            content: '';
            position: absolute;
            top: -40px;
            right: -40px;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.18) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .hero-header-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #34d399;
            font-size: 0.8rem;
            font-weight: 800;
            padding: 5px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
        }

        .hero-title {
            font-size: 2.15rem;
            font-weight: 900;
            line-height: 1.2;
            color: #ffffff;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .hero-title .title-accent {
            color: #34d399;
            background: linear-gradient(135deg, #34d399 0%, #fbbf24 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 1.05rem;
            color: #cbd5e1;
            line-height: 1.6;
            max-width: 820px;
            margin-bottom: 28px;
        }

        /* Cards Rápidos de Compra no Hero */
        .hero-offers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px;
            margin-bottom: 24px;
        }

        .offer-card {
            background: rgba(15, 23, 42, 0.7);
            border-radius: 14px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .offer-card:hover {
            transform: translateY(-2px);
        }

        .offer-card.avulso {
            border-color: rgba(16, 185, 129, 0.4);
            background: linear-gradient(180deg, rgba(5, 150, 105, 0.12) 0%, rgba(15, 23, 42, 0.8) 100%);
        }

        .offer-card.vip {
            border-color: rgba(245, 158, 11, 0.4);
            background: linear-gradient(180deg, rgba(245, 158, 11, 0.12) 0%, rgba(15, 23, 42, 0.8) 100%);
        }

        .offer-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .offer-pill {
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            padding: 3px 10px;
            border-radius: 12px;
            letter-spacing: 0.4px;
        }

        .offer-pill.green {
            background: rgba(16, 185, 129, 0.25);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .offer-pill.gold {
            background: rgba(245, 158, 11, 0.25);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.4);
        }

        .offer-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: white;
            margin-bottom: 4px;
        }

        .offer-price {
            font-size: 1.85rem;
            font-weight: 900;
            color: white;
            margin-bottom: 12px;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .offer-price span {
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: normal;
        }

        .offer-benefits {
            list-style: none;
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .offer-benefits li {
            font-size: 0.86rem;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-offer {
            width: 100%;
            min-height: 48px;
            border-radius: 10px;
            border: none;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-offer-green {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.35);
        }

        .btn-offer-green:hover {
            opacity: 0.95;
            box-shadow: 0 6px 18px rgba(5, 150, 105, 0.5);
        }

        .btn-offer-gold {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #0f172a;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35);
        }

        .btn-offer-gold:hover {
            opacity: 0.95;
            box-shadow: 0 6px 18px rgba(245, 158, 11, 0.5);
        }

        .hero-trust-badges {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.84rem;
            color: #94a3b8;
        }

        .trust-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* ============================================================
           3. SEÇÃO DAS 9 LOTERIAS OFICIAIS DA CAIXA
           ============================================================ */
        .section-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .section-header h2 {
            font-size: 1.8rem;
            font-weight: 800;
            color: white;
            letter-spacing: -0.3px;
        }

        .section-header p {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-top: 6px;
        }

        .loterias-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 45px;
        }

        .loteria-card {
            background: var(--card-dark);
            border-radius: 18px;
            padding: 24px 22px;
            border: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            transition: all 0.25s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }

        .loteria-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
        }

        .loteria-card-glow {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            transition: height 0.2s ease;
        }

        .loteria-card:hover .loteria-card-glow {
            height: 6px;
        }

        .loteria-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .loteria-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .loteria-icon-box {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }

        .loteria-name {
            font-size: 1.35rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.2px;
        }

        .loteria-tag {
            font-size: 0.72rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            white-space: nowrap;
        }

        .loteria-specs {
            list-style: none;
            margin: 14px 0 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(15, 23, 42, 0.55);
            border-radius: 12px;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .loteria-spec-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.86rem;
            color: #94a3b8;
        }

        .loteria-spec-row strong {
            color: #f1f5f9;
            font-weight: 600;
        }

        .loteria-spec-badge {
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .btn-analisar-loteria {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            min-height: 48px;
            border-radius: 12px;
            color: white;
            font-size: 0.95rem;
            font-weight: 800;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
        }

        .btn-analisar-loteria:hover {
            opacity: 0.94;
            transform: translateY(-1px);
        }

        /* ============================================================
           4. MODAIS DE CHECKOUT RÁPIDO (PIX E INFINITEPAY)
           ============================================================ */
        .checkout-modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(8px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .checkout-modal {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            max-width: 480px;
            width: 100%;
            padding: 28px 24px;
            text-align: center;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .checkout-modal-close {
            position: absolute;
            top: 14px;
            right: 16px;
            background: none;
            border: none;
            font-size: 1.6rem;
            color: #94a3b8;
            cursor: pointer;
            line-height: 1;
        }

        .pix-qrcode-box {
            background: white;
            padding: 14px;
            border-radius: 12px;
            display: inline-block;
            margin: 16px 0;
        }

        .pix-copia-cola-box {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.8rem;
            color: #38bdf8;
            word-break: break-all;
            margin-bottom: 16px;
            max-height: 80px;
            overflow-y: auto;
            text-align: left;
        }

        /* ============================================================
           5. FOOTER E INFORMAÇÕES DE RESPONSABILIDADE
           ============================================================ */
        footer {
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 30px 16px 20px;
            font-size: 0.86rem;
            color: #94a3b8;
            line-height: 1.6;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .footer-links a {
            color: #cbd5e1;
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: #34d399;
            text-decoration: underline;
        }

        /* ============================================================
           6. REGRAS ESPECÍFICAS DE RESPONSIVIDADE MOBILE (SMARTPHONES)
           ============================================================ */
        @media (max-width: 768px) {
            body {
                padding: 14px 10px;
            }

            .user-top-bar {
                flex-direction: column;
                align-items: stretch;
                padding: 14px;
                gap: 12px;
                margin-bottom: 18px;
            }

            .user-info-group {
                justify-content: space-between;
                width: 100%;
            }

            .user-top-actions {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                width: 100%;
            }

            .btn-top {
                width: 100%;
                padding: 10px 8px;
                font-size: 0.82rem;
                min-height: 44px;
            }

            .btn-top-exit {
                grid-column: span 2;
            }

            .hero-banner {
                padding: 22px 16px;
                margin-bottom: 24px;
                border-radius: 16px;
            }

            .hero-title {
                font-size: 1.55rem;
                line-height: 1.25;
            }

            .hero-subtitle {
                font-size: 0.9rem;
                margin-bottom: 20px;
            }

            .hero-offers-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .offer-card {
                padding: 16px;
            }

            .offer-price {
                font-size: 1.65rem;
                margin-bottom: 10px;
            }

            .section-header h2 {
                font-size: 1.45rem;
            }

            .loterias-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .loteria-card {
                padding: 18px 16px;
            }

            .checkout-modal {
                padding: 20px 14px;
            }
        }

        @media (max-width: 480px) {
            .hero-title {
                font-size: 1.35rem;
            }

            .user-brand-logo {
                font-size: 0.95rem;
            }

            .btn-top {
                font-size: 0.78rem;
            }
        }

        /* ============================================================
           HERO TEMPORÁRIA: LOTOFÁCIL DA INDEPENDÊNCIA (R$ 300 MILHÕES)
           ============================================================ */
        .hero-independencia-section {
            position: relative;
            background: radial-gradient(ellipse at 50% -10%, #1e1b4b 0%, #090d1a 55%, #030712 100%) !important;
            border: 1px solid rgba(245, 158, 11, 0.4);
            border-radius: 22px;
            padding: 40px 24px 30px;
            margin-bottom: 32px;
            text-align: center;
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.85);
            overflow: hidden;
        }

        .indep-glow-bg {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 750px;
            height: 250px;
            background: radial-gradient(ellipse at 50% 0%, rgba(245, 158, 11, 0.12) 0%, rgba(192, 38, 211, 0.08) 40%, transparent 70%);
            pointer-events: none;
        }

        .indep-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.5);
            color: #fef08a;
            padding: 5px 16px;
            border-radius: 999px;
            font-size: clamp(0.72rem, 2.2vw, 0.82rem);
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 12px;
            box-shadow: 0 0 16px rgba(245, 158, 11, 0.2);
            position: relative;
            z-index: 1;
            max-width: 95%;
        }

        .indep-subtitle-top {
            font-size: clamp(0.74rem, 2.2vw, 0.86rem);
            font-weight: 700;
            color: #cbd5e1;
            letter-spacing: 1.6px;
            margin-bottom: 10px;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
        }

        .indep-main-title {
            font-size: clamp(1.75rem, 4.5vw, 3rem);
            font-weight: 950;
            color: #ffffff;
            letter-spacing: -0.5px;
            line-height: 1.15;
            margin-bottom: 12px;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
        }

        .indep-br-mobile {
            display: none;
        }

        .indep-title-gold {
            color: #fde047;
            text-shadow: 0 0 25px rgba(253, 224, 71, 0.5), 0 2px 4px rgba(0, 0, 0, 0.9);
        }

        .indep-prize-card {
            margin: 10px auto 16px;
            max-width: 700px;
            position: relative;
            z-index: 1;
        }

        .indep-prize-tag {
            font-size: 0.82rem;
            font-weight: 800;
            color: #f59e0b;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 4px;
        }

        .indep-prize-amount {
            font-size: clamp(2.2rem, 7.8vw, 4.8rem);
            font-weight: 950;
            line-height: 1;
            letter-spacing: -0.5px;
            color: #fef08a;
            text-shadow: 0 0 35px rgba(251, 191, 36, 0.45), 0 4px 14px rgba(0, 0, 0, 0.9);
        }

        .indep-nao-acumula-badge {
            display: inline-block;
            background: rgba(220, 38, 38, 0.22);
            border: 1px solid #ef4444;
            color: #ffffff;
            font-weight: 800;
            font-size: clamp(0.76rem, 2.2vw, 0.88rem);
            padding: 8px 20px;
            border-radius: 999px;
            letter-spacing: 0.4px;
            margin-top: 10px;
            box-shadow: 0 4px 18px rgba(220, 38, 38, 0.25);
            max-width: 95%;
            line-height: 1.4;
        }

        .indep-lead-text {
            color: #f1f5f9;
            font-size: clamp(0.98rem, 2.1vw, 1.15rem);
            max-width: 800px;
            margin: 18px auto 24px;
            line-height: 1.7;
            position: relative;
            z-index: 1;
        }

        .indep-lead-highlight {
            display: block;
            font-size: clamp(1.1rem, 2.5vw, 1.35rem);
            color: #fef08a !important;
            font-weight: 900;

{% block extra_js %}
<script>
        const IS_AUTHENTICATED = {{ 'true' if current_user else 'false' }};
        let compraAtual = { tipo: 'avulso', valor: 5.00, titulo: 'Palpite Avulso (R$ 5,00)' };
        let pagamentoAtualId = null;

        function abrirModalCompraRapida(tipo, valor, titulo) {
            if (!IS_AUTHENTICATED) {
                alert('Para vincular o pagamento à sua conta e liberar seus palpites, por favor entre na sua conta ou cadastre-se.');
                window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname);
                return;
            }
            compraAtual = { tipo, valor, titulo };
            document.getElementById('modal-escolha-titulo').textContent = titulo;
            document.getElementById('modal-escolha-valor').textContent = 'R$ ' + valor.toFixed(2).replace('.', ',');
            document.getElementById('modal-escolha-pagamento').style.display = 'flex';
        }

        function fecharModalEscolha() {
            document.getElementById('modal-escolha-pagamento').style.display = 'none';
        }

        function fecharModalPix() {
            document.getElementById('modal-pix-qrcode').style.display = 'none';
        }

        async function parseJsonResponse(res, redirectPath = '/dashboard') {
            const contentType = res.headers.get('content-type') || '';
            let data = null;
            if (contentType.includes('application/json')) {
                try {
                    data = await res.json();
                } catch (e) {
                    data = null;
                }
            }
            if (res.status === 401 || (data && data.requer_login)) {
                alert('Sua sessão expirou ou é necessário entrar na sua conta. Redirecionando...');
                window.location.href = '/login?next=' + encodeURIComponent(redirectPath);
                return null;
            }
            if (!data) {
                throw new Error(res.statusText || 'Resposta inesperada do servidor.');
            }
            return data;
        }

        // Checkout InfinitePay com redirecionamento direto
        async function executarCheckoutInfinitePay() {
            if (!IS_AUTHENTICATED) {
                alert('Para vincular o pagamento à sua conta e liberar seus créditos, por favor entre na sua conta.');
                window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname);
                return;
            }
            const btn = document.getElementById('btn-infinite-dashboard');
            const textoOriginal = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '⏳ <em>Conectando à InfinitePay...</em>';

            try {
                const res = await fetch('/api/checkout/infinitepay', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tipo: compraAtual.tipo, valor: compraAtual.valor, redirect_path: '/dashboard' })
                });
                const data = await parseJsonResponse(res, '/dashboard');
                if (!data) return;

                if (data.sucesso && data.checkout_url) {
                    window.location.href = data.checkout_url;
                } else {
                    alert('Não foi possível iniciar InfinitePay: ' + (data.erro || 'Tente novamente.'));
                    btn.disabled = false;
                    btn.innerHTML = textoOriginal;
                }
            } catch (e) {
                alert('Erro ao conectar com InfinitePay: ' + e.message);
                btn.disabled = false;
                btn.innerHTML = textoOriginal;
            }
        }

        // Checkout PIX Direto no Modal com QR Code Real
        async function executarCheckoutPixDireto() {
            if (!IS_AUTHENTICATED) {
                alert('Para vincular o pagamento à sua conta e liberar seus créditos, por favor entre na sua conta.');
                window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname);
                return;
            }
            fecharModalEscolha();
            document.getElementById('pix-modal-titulo').textContent = compraAtual.titulo;
            document.getElementById('pix-modal-valor').textContent = 'R$ ' + compraAtual.valor.toFixed(2).replace('.', ',');
            document.getElementById('pix-copia-cola-texto').textContent = 'Gerando cobrança PIX oficial...';
            const qrImg = document.getElementById('pix-qrcode-img');
            const qrLoading = document.getElementById('pix-qrcode-loading');
            if (qrImg) qrImg.style.display = 'none';
            if (qrLoading) qrLoading.style.display = 'flex';
            document.getElementById('modal-pix-qrcode').style.display = 'flex';

            try {
                const res = await fetch('/api/checkout/pix', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tipo: compraAtual.tipo, valor: compraAtual.valor })
                });
                const data = await parseJsonResponse(res, '/dashboard');
                if (!data) return;

                if (data.sucesso) {
                    pagamentoAtualId = data.pagamento.id;
                    document.getElementById('pix-copia-cola-texto').textContent = data.pagamento.pix_copia_cola;
                    const qrSrc = data.pix_qr_code_base64 || (data.pagamento && data.pagamento.pix_qr_code_base64);
                    if (qrSrc && qrImg) {
                        qrImg.src = qrSrc;
                        qrImg.style.display = 'block';
                        if (qrLoading) qrLoading.style.display = 'none';
                    }
                } else {
                    alert('Erro ao gerar cobrança PIX: ' + (data.erro || 'Falha'));
                }
            } catch (e) {
                alert('Erro ao gerar PIX: ' + e.message);
            }
        }

        function copiarPixCodigoDashboard() {
            const codigo = document.getElementById('pix-copia-cola-texto').textContent;
            navigator.clipboard.writeText(codigo).then(() => {
                alert('Código PIX copiado com sucesso! Abra seu aplicativo bancário e utilize o PIX Copia e Cola.');
            });
        }

        async function confirmarPixDashboard() {
            if (!pagamentoAtualId) return;
            const btn = document.getElementById('btn-confirmar-pix-dashboard');
            btn.innerHTML = '⏳ <em>Validando pagamento...</em>';

            try {
                const res = await fetch(`/api/checkout/confirmar/${pagamentoAtualId}`, { method: 'POST' });
                const data = await parseJsonResponse(res, '/dashboard');
                if (!data) return;

                if (data.sucesso) {
                    alert('🎉 Parabéns! Pagamento aprovado com sucesso! Seus créditos já foram liberados.');
                    window.location.reload();
                } else {
                    alert('Status: ' + (data.erro || 'Aguardando compensação do PIX. Se já pagou, aguarde alguns segundos.'));
                    btn.innerHTML = '✅ Já Paguei / Liberar Acesso Agora';
                }
            } catch (e) {
                alert('Erro na confirmação: ' + e.message);
                btn.innerHTML = '✅ Já Paguei / Liberar Acesso Agora';
            }
        }

        // Verificação se retornou da InfinitePay com sucesso
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('checkout') === 'sucesso') {
                const pId = urlParams.get('payment_id');
                if (pId) {
                    fetch(`/api/checkout/status/${pId}?checkout=sucesso`)
                        .then(r => parseJsonResponse(r, '/dashboard'))
                        .then(data => {
                            if (!data) return;
                            alert('🎉 Parabéns! Seu pagamento foi confirmado com sucesso e seu acesso está 100% liberado!');
                            window.location.href = '/dashboard';
                        })
                        .catch(() => {
                            window.location.href = '/dashboard';
                        });
                } else {
                    alert('🎉 Pagamento concluído com sucesso!');
                    window.location.href = '/dashboard';
                }
            }
        });

        // Contador Regressivo da Lotofácil da Independência (15/09/2026 às 20:00 Horário de Brasília)
        (function() {
            const targetDate = new Date('2026-09-15T20:00:00-03:00').getTime();

            function updateCountdownDash() {
                const now = new Date().getTime();
                const diff = targetDate - now;

                const dEl = document.getElementById('indep-days-dash');
                const hEl = document.getElementById('indep-hours-dash');
                const mEl = document.getElementById('indep-minutes-dash');
                const sEl = document.getElementById('indep-seconds-dash');

                if (!dEl || !hEl || !mEl || !sEl) return;

                if (diff <= 0) {
                    dEl.innerText = '00';
                    hEl.innerText = '00';
                    mEl.innerText = '00';
                    sEl.innerText = '00';
                    const header = document.querySelector('.hero-independencia-section .indep-countdown-header');
                    if (header) header.innerHTML = '🔴 SORTEIO EM ANDAMENTO OU CONCLUÍDO!';
                    return;
                }

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                dEl.innerText = String(days).padStart(2, '0');
                hEl.innerText = String(hours).padStart(2, '0');
                mEl.innerText = String(minutes).padStart(2, '0');
                sEl.innerText = String(seconds).padStart(2, '0');
            }

            updateCountdownDash();
            setInterval(updateCountdownDash, 1000);
        })();
    
<script>
    // Progressive Disclosure Logic
    document.addEventListener('DOMContentLoaded', function() {
        // Envolve os filtros em um accordion
        const forms = document.querySelectorAll('.loteria-form');
        forms.forEach(form => {
            const filterGroups = form.querySelectorAll('.filter-group:not(:first-child)');
            if(filterGroups.length > 0) {
                const wrapper = document.createElement('div');
                wrapper.className = 'filtros-avancados-container';
                
                const toggle = document.createElement('button');
                toggle.type = 'button';
                toggle.className = 'filtros-toggle';
                toggle.innerHTML = '⚙️ Filtros Matemáticos Avançados <span>▼</span>';
                
                const content = document.createElement('div');
                content.className = 'filtros-content';
                
                filterGroups.forEach(fg => content.appendChild(fg));
                
                wrapper.appendChild(toggle);
                wrapper.appendChild(content);
                
                // insert before the submit button
                const submitBtn = form.querySelector('.btn-gerar');
                form.insertBefore(wrapper, submitBtn);
                
                toggle.addEventListener('click', () => {
                    content.classList.toggle('open');
                    toggle.querySelector('span').innerHTML = content.classList.contains('open') ? '▲' : '▼';
                });
            }
            
            // Override submit to show global loading
            form.addEventListener('submit', () => {
                showLoading('A IA está calculando e eliminando combinações improváveis...');
            });
        });
    });
</script>
