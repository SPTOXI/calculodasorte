<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18453066810"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'AW-18453066810');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }} — Cálculo da Sorte</title>
    <meta name="description" content="{{ post.description }}">
    <meta name="robots" content="index, follow">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">

    <!-- Tipografia institucional (peso forte, arredondada) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root{
            --primary:#0046AD;
            --primary-dark:#003380;
            --primary-light:#2E7DE1;
            --gold:#F39200;
            --gold-dark:#C97400;
            --navy:#0A1A3F;
            --text:#101F38;
            --text-muted:#5B6B82;
            --bg:#FFFFFF;
            --bg-alt:#F2F6FC;
            --card:#FFFFFF;
            --card-border:#E1E8F2;
            --font-heading:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
        }
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
        body{background-color:var(--bg-alt);color:var(--text);line-height:1.8;padding:40px 20px}
        .container{max-width:760px;margin:0 auto;background:var(--card);padding:40px 50px;border-radius:16px;border:1px solid var(--card-border);box-shadow:0 15px 35px rgba(10,26,63,0.1)}
        .top-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;padding-bottom:20px;border-bottom:1px solid var(--card-border)}
        .nav-brand-pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-heading);font-weight:800;color:var(--navy);padding:6px 14px;background:var(--bg-alt);border-radius:20px;border:1px solid var(--card-border);font-size:0.9rem}
        .nav-brand-pill .brand-highlight{color:var(--primary)}
        .btn-back{color:var(--text-muted);text-decoration:none;font-weight:600;font-size:0.9rem}
        .btn-back:hover{color:var(--primary)}
        .post-meta{font-size:0.9rem;color:var(--gold-dark);margin-bottom:10px;font-weight:700}
        h1{font-family:var(--font-heading);font-size:2.2rem;font-weight:800;line-height:1.2;margin-bottom:30px;color:var(--navy)}
        h2{font-family:var(--font-heading);font-size:1.5rem;font-weight:700;color:var(--navy);margin-top:40px;margin-bottom:15px}
        h3{font-size:1.2rem;color:var(--navy);margin-top:25px;margin-bottom:10px}
        p{margin-bottom:20px;color:var(--text);font-size:1.05rem}
        ul,ol{margin-bottom:20px;padding-left:20px;color:var(--text)}
        li{margin-bottom:8px}
        strong{color:var(--navy)}
        code{background:var(--bg-alt);border:1px solid var(--card-border);border-radius:4px;padding:2px 6px;color:var(--primary-dark);font-size:0.92em}
        blockquote{border-left:4px solid var(--primary);background:var(--bg-alt);padding:14px 18px;margin:20px 0;border-radius:0 8px 8px 0;font-size:1.02rem;color:var(--text)}
        table{width:100%;border-collapse:collapse;margin:25px 0;font-size:0.95rem;background:var(--card);border-radius:10px;overflow:hidden;border:1px solid var(--card-border)}
        th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--card-border)}
        th{background:var(--bg-alt);font-family:var(--font-heading);font-weight:700;color:var(--navy)}
        tr:hover{background:rgba(0,70,173,0.03)}
        .geo-bite{background:#EEF4FF;border:1px solid rgba(0,70,173,0.25);border-left:4px solid var(--primary);border-radius:8px;padding:16px 20px;margin:20px 0;font-size:1.02rem;line-height:1.6}
        .cta-box{background:var(--bg-alt);border:1px solid var(--card-border);padding:25px;border-radius:12px;margin-top:40px;text-align:center}
        .cta-box h3{color:var(--navy)}
        .cta-btn{display:inline-block;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white;font-family:var(--font-heading);padding:12px 24px;border-radius:8px;text-decoration:none;font-weight:700;margin-top:15px}
        @media (max-width:768px){.container{padding:30px 20px}h1{font-size:1.8rem}table{display:block;overflow-x:auto}}
    </style>
    <!-- Schema Markup para Artigo de Blog (SEO/LLM) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BlogPosting",
      "headline": "{{ post.title }}",
      "datePublished": "{{ post.date }}",
      "author": {
        "@type": "Organization",
        "name": "{{ post.author }}"
      },
      "publisher": {
        "@type": "Organization",
        "name": "Cálculo da Sorte",
        "logo": {
          "@type": "ImageObject",
          "url": "https://calculodasorte.com.br/static/logo.png"
        }
      }
    }
    </script>
</head>
<body>
    <div class="container">
        <div class="top-nav">
            <div class="nav-brand-pill">
                <img src="/static/logo.png" alt="Logo" style="width: 20px; height: 20px; object-fit: contain;"> Cálculo da <span class="brand-highlight">Sorte</span>
            </div>
            <a href="/blog" class="btn-back">← Voltar ao Blog</a>
        </div>
        
        <article>
            <div class="post-meta">{{ post.date }} • Por {{ post.author }}</div>
            <h1>{{ post.title }}</h1>
            
            {% include post.template %}
            
            <div class="cta-box">
                <h3>Pare de apostar no escuro.</h3>
                <p>Use a estatística real a seu favor com nossa plataforma.</p>
                <a href="/" class="cta-btn">Conhecer o Cálculo da Sorte</a>
            </div>
        </article>
    </div>
</body>
</html>
