<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta — Cálculo da Sorte | Ganhe 1 Análise Grátis</title>
    <meta name="description" content="Cadastre-se gratuitamente no Cálculo da Sorte e ganhe 1 análise de cortesia para gerar palpites estruturados e fechamentos para qualquer loteria da Caixa.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://calculodasorte.com.br/cadastro">

    <!-- Favicon Oficial do Dado da Sorte (.ico, .svg, .png) -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">

    <!-- Tipografia institucional (peso forte, arredondada) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>:root{--primary:#0046AD;--primary-dark:#003380;--primary-light:#2E7DE1;--gold:#F39200;--gold-dark:#C97400;--navy:#0A1A3F;--text:#101F38;--text-muted:#5B6B82;--bg:#FFFFFF;--bg-alt:#F2F6FC;--card:#FFFFFF;--card-border:#E1E8F2;--font-heading:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}body{background-color:var(--bg-alt);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 20px;background:radial-gradient(circle at 50% 0%,rgba(0,70,173,0.08) 0%,var(--bg-alt) 60%)}.auth-container{width:100%;max-width:480px;background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:40px 36px;box-shadow:0 15px 35px rgba(10,26,63,0.10)}.auth-header{text-align:center;margin-bottom:28px}.logo-icon{width:50px;height:50px;background:linear-gradient(135deg,var(--primary),var(--gold));border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:1.6rem;margin-bottom:12px;box-shadow:0 4px 14px rgba(0,70,173,0.3)}.auth-header h1{font-family:var(--font-heading);font-size:1.8rem;font-weight:800;margin-bottom:8px;color:var(--navy)}.auth-header p{font-size:0.95rem;color:var(--text-muted)}.bonus-badge{background:rgba(243,146,0,0.10);border:1px solid rgba(243,146,0,0.3);color:var(--gold-dark);padding:10px 14px;border-radius:8px;font-size:0.88rem;font-weight:600;text-align:center;margin-bottom:24px;display:flex;align-items:center;justify-content:center;gap:8px}.form-group{margin-bottom:20px}.form-group label{display:block;font-size:0.9rem;font-weight:600;margin-bottom:8px;color:var(--text)}.form-group input{width:100%;padding:13px 16px;border-radius:8px;border:1px solid var(--card-border);background:#F8FAFD;color:var(--text);font-size:1rem;transition:all 0.2s}.form-group input:focus{outline:none;border-color:var(--primary-light);box-shadow:0 0 0 3px rgba(46,125,225,0.18);background:#fff}.btn-submit{width:100%;padding:14px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white;border:none;border-radius:8px;font-family:var(--font-heading);font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,70,173,0.3);transition:all 0.2s;margin-top:10px}.btn-submit:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,70,173,0.42)}.alert-error{background:rgba(220,38,38,0.08);border:1px solid rgba(220,38,38,0.25);color:#B91C1C;padding:12px 16px;border-radius:8px;font-size:0.9rem;margin-bottom:20px}.auth-footer{text-align:center;margin-top:24px;font-size:0.92rem;color:var(--text-muted)}.auth-footer a{color:var(--primary);text-decoration:none;font-weight:700}.auth-footer a:hover{text-decoration:underline}@media (max-width:480px){body{padding:16px 12px}.auth-container{padding:24px 18px;border-radius:14px}.auth-header h1{font-size:1.55rem}}</style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <div style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px; font-size: 1.15rem; font-weight: 800; color: var(--navy); background: rgba(0,70,173,0.06); padding: 6px 16px; border-radius: 20px; border: 1px solid rgba(0,70,173,0.15);">
                <img src="/static/favicon.ico" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;"> <span>Cálculo da <strong style="color: var(--primary);">Sorte</strong></span>
            </div>
            <h1>Criar Conta</h1>
            <p>Acesse o sistema e gerencie suas apostas</p>
        </div>

        <div class="bonus-badge">
            <span>🎁</span>
            <span><strong>Bônus:</strong> Ganhe 1 análise completa gratuita ao se cadastrar!</span>
        </div>

        {% if erro %}
        <div class="alert-error">
            ⚠️ {{ erro }}
        </div>
        {% endif %}

        <form method="POST" action="/cadastro">
            <input type="hidden" name="plano_desejado" value="{{ plano_desejado or 'free' }}">

            <div class="form-group">
                <label for="nome">Seu Nome Completo:</label>
                <input type="text" id="nome" name="nome" value="{{ nome or '' }}" required placeholder="Ex: Carlos Silva" autofocus autocapitalize="words" autocomplete="name">
            </div>

            <div class="form-group">
                <label for="email">Seu Melhor E-mail:</label>
                <input type="email" id="email" name="email" value="{{ email or '' }}" required placeholder="Ex: carlos@email.com" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Crie uma Senha Segura:</label>
                <input type="password" id="password" name="password" required placeholder="Mínimo de 4 caracteres" autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirme sua Senha:</label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="Digite a senha novamente" autocomplete="new-password">
            </div>

            <div class="form-group" style="margin-top: 16px; margin-bottom: 22px;">
                <label style="display: flex; align-items: flex-start; gap: 10px; font-weight: normal; font-size: 0.85rem; color: var(--text-muted); cursor: pointer;">
                    <input type="checkbox" name="termos_lgpd" id="termos_lgpd" required style="width: auto; margin-top: 4px; accent-color: var(--primary); cursor: pointer;">
                    <span>Li e concordo com os <a href="/termos" target="_blank" style="color: var(--primary); text-decoration: underline;">Termos de Uso</a> e com a <a href="/privacidade" target="_blank" style="color: var(--primary); text-decoration: underline;">Política de Privacidade (LGPD)</a>. Declaro ter mais de 18 anos.</span>
                </label>
            </div>

            <button type="submit" class="btn-submit">
                Concluir Cadastro e Acessar 🚀
            </button>
        </form>

        <div class="auth-footer">
            Já possui uma conta? <a href="/login">Fazer Login</a>
        </div>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            var emailInput = document.getElementById('email');
            if (emailInput) {
                emailInput.value = emailInput.value.trim().toLowerCase();
            }
            var nomeInput = document.getElementById('nome');
            if (nomeInput) {
                nomeInput.value = nomeInput.value.trim();
            }
        });
    </script>
</body>
</html>
