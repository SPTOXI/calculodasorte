<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta — Cálculo da Sorte</title>
    <style>
        :root {
            --primary: #059669;
            --primary-dark: #047857;
            --primary-light: #10b981;
            --gold: #f59e0b;
            --dark: #0f172a;
            --dark-card: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b1120;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            background: radial-gradient(circle at 50% 15%, rgba(5, 150, 105, 0.2) 0%, #0b1120 70%);
        }

        .auth-container {
            width: 100%;
            max-width: 480px;
            background: var(--dark-card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 40px 36px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--gold));
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin-bottom: 12px;
            box-shadow: 0 4px 14px rgba(5, 150, 105, 0.4);
        }

        .auth-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .auth-header p {
            font-size: 0.95rem;
            color: #94a3b8;
        }

        .bonus-badge {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--primary-light);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: #0f172a;
            color: white;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(5, 150, 105, 0.35);
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(5, 150, 105, 0.5);
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.92rem;
            color: #94a3b8;
        }

        .auth-footer a {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 700;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px 12px;
            }
            .auth-container {
                padding: 24px 18px;
                border-radius: 14px;
            }
            .auth-header h1 {
                font-size: 1.55rem;
            }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <div class="logo-icon">🎲</div>
            <h1>Criar Conta</h1>
            <p>Acesse o sistema e gerencie suas apostas</p>
        </div>

        <div class="bonus-badge">
            <span>🎁</span>
            <span><strong>Bônus:</strong> Ganhe 1 análise completa gratuita ao se cadastrar!</span>
        </div>

        {% if erro %}
        <div class="alert-error">
            ⚠️ {{ erro }}
        </div>
        {% endif %}

        <form method="POST" action="/cadastro">
            <input type="hidden" name="plano_desejado" value="{{ plano_desejado or 'free' }}">

            <div class="form-group">
                <label for="nome">Seu Nome Completo:</label>
                <input type="text" id="nome" name="nome" value="{{ nome or '' }}" required placeholder="Ex: Carlos Silva" autofocus>
            </div>

            <div class="form-group">
                <label for="email">Seu Melhor E-mail:</label>
                <input type="email" id="email" name="email" value="{{ email or '' }}" required placeholder="Ex: carlos@email.com">
            </div>

            <div class="form-group">
                <label for="password">Crie uma Senha Segura:</label>
                <input type="password" id="password" name="password" required placeholder="Mínimo de 4 caracteres">
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirme sua Senha:</label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="Digite a senha novamente">
            </div>

            <div class="form-group" style="margin-top: 16px; margin-bottom: 22px;">
                <label style="display: flex; align-items: flex-start; gap: 10px; font-weight: normal; font-size: 0.85rem; color: #cbd5e1; cursor: pointer;">
                    <input type="checkbox" name="termos_lgpd" id="termos_lgpd" required style="width: auto; margin-top: 4px; accent-color: var(--primary); cursor: pointer;">
                    <span>Li e concordo com os <a href="/termos" target="_blank" style="color: var(--primary-light); text-decoration: underline;">Termos de Uso</a> e com a <a href="/privacidade" target="_blank" style="color: var(--primary-light); text-decoration: underline;">Política de Privacidade (LGPD)</a>. Declaro ter mais de 18 anos.</span>
                </label>
            </div>

            <button type="submit" class="btn-submit">
                Concluir Cadastro e Acessar 🚀
            </button>
        </form>

        <div class="auth-footer">
            Já possui uma conta? <a href="/login">Fazer Login</a>
        </div>
    </div>

</body>
</html>
