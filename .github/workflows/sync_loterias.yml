name: Atualização Automática das Loterias Caixa

on:
  schedule:
    # Calendário da Caixa desde 19/07/2026: sorteios de domingo a sexta às 21h e aos domingos às 11h
    # (sem sorteios aos sábados). Horários abaixo em UTC (Brasília = UTC-3).
    # Domingo a sexta, 21:45 de Brasília = 00:45 UTC de segunda a sábado
    - cron: '45 0 * * 1-6'
    # Domingo a sexta, 22:45 de Brasília (consolidação) = 01:45 UTC de segunda a sábado
    - cron: '45 1 * * 1-6'
    # Domingo, 12:30 de Brasília (sorteios das 11h) = 15:30 UTC de domingo
    - cron: '30 15 * * 0'
  workflow_dispatch:

jobs:
  sincronizar:
    name: Sincronizar Resultados Oficiais
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Disparar Sincronização na Calculadora da Sorte
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Disparando sincronização oficial da Caixa..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://www.calculodasorte.com.br/api/cron/atualizar")
          echo "HTTP Status: $HTTP_STATUS"
          cat response.json
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Sincronização executada com sucesso!"
          else
            echo "Erro: servidor retornou HTTP $HTTP_STATUS (401 = CRON_SECRET ausente ou diferente do Vercel)"
            exit 1
          fi
