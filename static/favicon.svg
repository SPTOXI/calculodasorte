<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="diceGrad" x1="15%" y1="10%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#4CAF7D"/>
      <stop offset="45%" stop-color="#2E9A63"/>
      <stop offset="100%" stop-color="#1F7A4D"/>
    </linearGradient>
    <radialGradient id="sheen" cx="30%" cy="22%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pipWhite" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#E9EEF2"/>
    </radialGradient>
    <radialGradient id="pipGold" cx="35%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#FFD873"/>
      <stop offset="55%" stop-color="#F3A616"/>
      <stop offset="100%" stop-color="#D98A0A"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0A1A3F" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Corpo do Dado Arredondado -->
  <rect x="7" y="7" width="86" height="86" rx="23" ry="23" fill="url(#diceGrad)" filter="url(#shadow)"/>
  <rect x="7" y="7" width="86" height="86" rx="23" ry="23" fill="url(#sheen)"/>
  <rect x="8.5" y="8.5" width="83" height="83" rx="21.5" ry="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Pontos do Dado (5 dezenas/pontos da sorte) -->
  <circle cx="28" cy="28" r="8" fill="url(#pipWhite)"/>
  <circle cx="72" cy="28" r="8" fill="url(#pipWhite)"/>
  <circle cx="50" cy="50" r="9" fill="url(#pipGold)"/>
  <circle cx="28" cy="72" r="8" fill="url(#pipWhite)"/>
  <circle cx="72" cy="72" r="8" fill="url(#pipWhite)"/>
</svg>
