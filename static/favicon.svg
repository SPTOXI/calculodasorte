<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="diceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Corpo do Dado Arredondado -->
  <rect x="8" y="8" width="84" height="84" rx="22" ry="22" fill="url(#diceGrad)" filter="url(#shadow)" stroke="#34d399" stroke-width="2.5"/>
  
  <!-- Pontos do Dado (5 dezenas/pontos da sorte) -->
  <circle cx="28" cy="28" r="7.5" fill="#ffffff"/>
  <circle cx="72" cy="28" r="7.5" fill="#ffffff"/>
  <circle cx="50" cy="50" r="8.5" fill="#fbbf24"/>
  <circle cx="28" cy="72" r="7.5" fill="#ffffff"/>
  <circle cx="72" cy="72" r="7.5" fill="#ffffff"/>
</svg>
